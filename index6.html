<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>STUDENT REGISTRATION FORM</h3>
    <form action="index7.html">
    <label for="">Full Name :</label>
    <input type="text" placeholder="Enter your full name"><br><br>
    <label for="">Email :</label>
    <input type="text" placeholder="Enter your email"><br><br>
    <label for="">Phone Number :</label>
    <input type="text" placeholder="Enter your phone number"><br><br>
    <label for="">Password :</label>
    <input type="password" placeholder="Enter your password"><br><br>
    <label for="">Gender :</label>
    <input type="radio"  name="male" ><label for="">Male</label>
    <input type="radio" name="male"><label for="">Female</label>
    <input type="radio" name="male"><label for="">Other</label><br><br>
    <label for="">Date of Birth :</label>
    <input type="date"><br><br>
    <label for="">Department :</label>
    <select name="department" id="department">
        <option value="">Select Department</option>
        <option value="">CSS</option>
        <option value="">IT</option>
        <option value="">ECE</option>
        <option value="">EEE</option>
    </select><br><br>
    <label for="">Skills :</label>
    <input type="checkbox">
    <label for="">HTML</label>
    <input type="checkbox">
    <label for="">CSS</label>
    <input type="checkbox">
    <label for="">JS</label>
    <input type="checkbox">
    <label for="">Java</label><br><br>
    <label for="">Address :</label>
    <textarea name="address" id="address" rows="4" cols="30"></textarea><br><br>
    <label for="">City :</label>
    <input type="text"><br><br>
    <label for="">State :</label>
    <input type="text"><br><br>
    <label for="">Pincode :</label>
    <input type="text"><br><br>
    <label for="">Uplode Resume :</label>
    <input type="file"><br><br>
    <input type="checkbox">
    <label for="">I agree to the Terms and Conditions</label><br><br>
    <input type="submit" value="Register">
    <input type="reset" value="Reset">

    </form>
    

</body>
</html>
